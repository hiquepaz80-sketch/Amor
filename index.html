<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>♥</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      color: #ffe6ec;
      font-family: Georgia, serif;
      background: radial-gradient(ellipse at 50% 35%, #3b0c1f 0%, #1b0613 45%, #07030a 100%);
    }

    .coracao {
      font-size: 56px;
      color: #ff7a93;
      text-shadow: 0 0 26px rgba(255, 70, 110, .8);
      animation: batida 1.4s ease-in-out infinite;
    }

    h1 {
      margin: 14px 0 22px;
      font-family: "Brush Script MT", cursive;
      font-weight: normal;
      font-size: clamp(30px, 8vw, 42px);
      color: #ff7a93;
      text-shadow: 0 0 22px rgba(255, 70, 110, .55);
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 16px;
      font-size: 18px;
      text-align: center;
      color: #ffe6ec;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 122, 147, .5);
      border-radius: 999px;
      outline: none;
    }

    input:focus {
      border-color: #ff7a93;
      box-shadow: 0 0 18px rgba(255, 70, 110, .35);
    }

    button {
      padding: 12px 30px;
      font-size: 17px;
      color: #ff7a93;
      background: transparent;
      border: 1px solid rgba(255, 122, 147, .7);
      border-radius: 999px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 122, 147, .15);
    }

    .erro {
      min-height: 22px;
      margin: 6px 0 0;
      font-size: 15px;
      color: #ff9fb3;
    }

    .dica {
      margin: 14px 0 0;
      font-size: 14px;
      color: #e9b4c2;
      font-style: italic;
    }

    .tremer {
      animation: tremer .4s;
    }

    @keyframes batida {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    @keyframes tremer {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      75% {
        transform: translateX(8px);
      }
    }
  </style>
</head>

    function limpar(s) { return s.trim().toLowerCase(); }

    async function abrir(senha) {
