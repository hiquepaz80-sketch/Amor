<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossa história</title>

  <!-- Liga o arquivo de estilo (o visual fica lá, em css/style.css) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Nossa história</h1>

  <!-- ===== SEÇÃO: TEMPO JUNTOS ===== -->
  <section id="tempo-juntos">
    <h2>Estamos juntos há</h2>

    <!-- A foto com efeito polaroid -->
    <figure class="polaroid">
      <!-- TROQUE "foto-exemplo.svg" pelo nome da sua foto (que fica na pasta "fotos") -->
      <img src="foto_pedido.png" alt="Foto de nós dois">
      <!-- TROQUE o texto da legenda -->
      <figcaption>Nós dois ♥</figcaption>
    </figure>

    <!-- O contador aparece aqui (o código lá embaixo preenche este texto) -->
    <div class="contador">
        <div class="caixa"><strong id="dias">0</strong><span>dias</span></div>
        <div class="caixa"><strong id="horas">0</strong><span>horas</span></div>
        <div class="caixa"><strong id="minutos">0</strong><span>min</span></div>
        <div class="caixa"><strong id="segundos">0</strong><span>seg</span></div>
</div>
  </section>

  <script src="script.js"></script>
</body>
</html>
